[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "inventario"
version = "0.1.0"
description = "Motor de reposición de inventario: pronóstico, pedido sugerido y seguimiento"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2,<3",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
