[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "inventario"
version = "0.1.0"
description = "Motor de reposición de inventario: pronóstico, pedido sugerido y seguimiento"
requires-python = ">=3.12,<3.13"
# Versiones exactas, iguales a las restricciones de Airflow 3.3.2: local, CI y contenedor
# usan lo mismo, y un pronóstico se puede reproducir con las mismas librerías.
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.5",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
