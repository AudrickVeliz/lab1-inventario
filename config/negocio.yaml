# Parámetros de negocio. Cambiarlos modifica la recomendación sin tocar el código.
# Kaggle no trae precios ni márgenes: los costos son supuestos del producto (DECISIONES.md, D-013).

# Día de la semana de cada corte: 0 es lunes.
dia_semana_corte: 0

# Días que cubre cada pronóstico y cada pedido: de martes a lunes si el corte es el lunes.
horizonte_dias: 7

baseline:
  # Observaciones del mismo día de la semana que se usan para cada pronóstico.
  semanas: 12
  # Un bloque con menos días observados no se usa para estimar el total del periodo.
  dias_minimos_por_bloque: 6

# Modelo de ML y criterio para reemplazar al vigente (DECISIONES.md, D-020 y D-021).
modelo:
  reentrenar_cada_cortes: 4
  # Cortes pasados que usa cada entrenamiento: dos años en total.
  semanas_totales: 104
  # De los más recientes, estos calculan los errores y estos comparan los modelos.
  semanas_calibracion: 12
  semanas_evaluacion: 8
  # Sin estas semanas para entrenar, sigue el modelo vigente.
  semanas_minimas_entrenamiento: 26
  # Un candidato reemplaza al vigente si baja el costo al menos esta proporción.
  mejora_minima_costo: 0.02

# Cuantiles diarios que se publican.
cuantiles: [0.10, 0.50, 0.90]

# Costos relativos por unidad.
costos:
  grupo_predeterminado: resto
  grupos:
    perecederos:
      quiebre: 3
      merma: 2
      familias:
        - BREAD/BAKERY
        - DAIRY
        - DELI
        - EGGS
        - MEATS
        - POULTRY
        - PREPARED FOODS
        - PRODUCE
        - SEAFOOD
    resto:
      quiebre: 3
      merma: 0.5
